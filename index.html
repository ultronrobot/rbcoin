<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RB Coin (sinov)</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#0b0907; --card:#181513; --line:#2a2622; --text:#f3efe8; --muted:#9a948a; --gold:#c9a24b; --err:#d2705f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         padding: calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px); }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .logo { letter-spacing:.18em; font-weight:700; font-size:14px; }
  .tag { font-size:11px; color:var(--gold); border:1px solid var(--gold); border-radius:999px; padding:2px 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px; }
  .bal { font-size:34px; font-weight:700; margin:4px 0; }
  .muted { color:var(--muted); font-size:13px; }
  .wid { font-family:ui-monospace,monospace; color:var(--gold); word-break:break-all; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input, select { width:100%; background:#0f0d0b; color:var(--text); border:1px solid var(--line); border-radius:12px; padding:12px; font-size:16px; }
  button { width:100%; margin-top:12px; padding:13px; border:0; border-radius:12px; background:var(--gold); color:#1a1408; font-weight:700; font-size:16px; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  button:disabled { opacity:.5; }
  .tx { display:flex; justify-content:space-between; padding:10px 0; border-top:1px solid var(--line); font-size:14px; }
  .in { color:#7fbf8a; } .out { color:var(--text); }
  #msg { min-height:20px; margin-top:8px; font-size:14px; } .err { color:var(--err); } .ok { color:#7fbf8a; }
</style>
</head>
<body>
<header><span class="logo">RB COIN</span><span class="tag">SINOV · TEST</span></header>
<div id="app"><div class="card muted">Yuklanmoqda… (bepul server uyg'onishi ~1 daqiqa olishi mumkin)</div></div>

<script>
// Render'dagi backend manzili. Deploydan keyin shu yerga yozing yoki config.js orqali bering.
const API = (window.RBC_API_URL || "__API_URL__").replace(/\/$/, "");
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
let token = null;

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((data.error && data.error.message) || "Xatolik (" + res.status + ")");
  return data;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const say = (t, cls) => { const m = document.getElementById("msg"); if (m) { m.textContent = t; m.className = cls || ""; } };

async function login() {
  if (!tg || !tg.initData) throw new Error("Bu sahifani Telegram ichidagi bot tugmasi orqali oching.");
  const r = await api("/api/v1/auth/telegram", { method: "POST", body: JSON.stringify({ init_data: tg.initData }) });
  token = r.token;
}

async function render() {
  const [w, txs] = await Promise.all([api("/api/v1/wallet"), api("/api/v1/transactions")]);
  document.getElementById("app").innerHTML = `
    <div class="card">
      <div class="muted">RBC balans (sinov)</div>
      <div class="bal">${esc(w.balance)}</div>
      <div class="muted">Hamyon ID</div><div class="wid">${esc(w.wallet_id)}</div>
      <div class="muted" style="margin-top:8px">${esc(w.notice)}</div>
      <button class="ghost" id="faucet">Test RBC olish</button>
    </div>
    <div class="card">
      <b>Transfer</b>
      <label>Qabul qiluvchi (Hamyon ID yoki Telegram ID)</label><input id="to" autocapitalize="characters">
      <label>Miqdor</label><input id="amt" inputmode="decimal" placeholder="100">
      <label>Komissiya usuli (2%)</label>
      <select id="mode"><option value="extra">Extra fee — qo'shimcha yechiladi</option><option value="included">Included fee — summadan ushlanadi</option></select>
      <div class="muted" id="preview" style="margin-top:8px"></div>
      <button id="send">Yuborish</button><div id="msg"></div>
    </div>
    <div class="card"><b>Operatsiyalar</b>${txs.length ? txs.map(t => `
      <div class="tx"><span>${t.type === "test_faucet" ? "Test balans" : t.direction === "in" ? "Qabul" : "Yuborildi"}</span>
      <span class="${t.direction}">${t.direction === "in" ? "+" : "−"}${esc(t.amount)}</span></div>`).join("") : '<div class="muted">Hali operatsiya yo\'q</div>'}</div>`;

  const prev = () => {
    const a = parseFloat(document.getElementById("amt").value), m = document.getElementById("mode").value;
    if (!(a > 0)) { document.getElementById("preview").textContent = ""; return; }
    const fee = Math.floor(a * 2) / 100;
    document.getElementById("preview").textContent = m === "extra"
      ? `Yechiladi: ${(a + fee).toFixed(2)} · Oladi: ${a.toFixed(2)} · Komissiya: ${fee.toFixed(2)} (taxminiy)`
      : `Yechiladi: ${a.toFixed(2)} · Oladi: ${(a - fee).toFixed(2)} · Komissiya: ${fee.toFixed(2)} (taxminiy)`;
  };
  document.getElementById("amt").oninput = prev; document.getElementById("mode").onchange = prev;

  document.getElementById("faucet").onclick = async () => {
    try { await api("/api/v1/dev/faucet", { method: "POST" }); await render(); } catch (e) { say(e.message, "err"); }
  };
  document.getElementById("send").onclick = async (ev) => {
    ev.target.disabled = true;
    try {
      const r = await api("/api/v1/transfer", { method: "POST", body: JSON.stringify({
        recipient: document.getElementById("to").value, amount: document.getElementById("amt").value,
        fee_mode: document.getElementById("mode").value, reference: crypto.randomUUID() }) });
      await render(); say("Yuborildi. Yechildi: " + r.sender_debit + ", oldi: " + r.amount, "ok");
    } catch (e) { say(e.message, "err"); ev.target.disabled = false; }
  };
}

(async () => {
  try { await login(); await render(); }
  catch (e) { document.getElementById("app").innerHTML = '<div class="card err">' + esc(e.message) + "</div>"; }
})();
</script>
</body>
</html>
