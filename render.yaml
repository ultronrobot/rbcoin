services:
  - type: web
    name: rbcoin-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: rbcoin-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: TEST_FAUCET
        value: "1"
      - key: BOT_TOKEN
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: WEBAPP_URL
        sync: false

  - type: web
    name: rbcoin-app
    runtime: static
    buildCommand: mkdir -p dist && sed "s|__API_URL__|$API_URL|g" index.html > dist/index.html
    staticPublishPath: dist
    envVars:
      - key: API_URL
        sync: false

databases:
  - name: rbcoin-db
    plan: free
    databaseName: rbcoin
    user: rbcoin
  
